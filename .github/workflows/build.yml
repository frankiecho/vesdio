name: Build executables

# Builds the per-OS VESDIO desktop executable with PyInstaller and publishes
# it as a downloadable artifact on every run, plus attaches it to a GitHub
# Release when a `v*` tag is pushed.
#
# IMPORTANT: this workflow only builds the *application*. The reference
# EXIOBASE dataset (the matrix files + manifest.json that
# src/data_bootstrap.py downloads on first run) is NOT produced here — it
# can't be, without a multi-GB/multi-hour ingest of the raw EXIOBASE
# download. The maintainer produces it separately, once, via
# `ingest_exiobase.build_release_manifest()` (see docs/PACKAGING.md), and
# uploads the resulting files as additional assets on the same GitHub
# Release this workflow attaches the executables to.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pywebview needs a native GUI backend per OS; PyInstaller must run on
      # the target platform and needs the backend importable in the build
      # venv so it can be discovered/bundled (see docs/PACKAGING.md).
      - name: Install Windows pywebview backend (pythonnet)
        if: runner.os == 'Windows'
        run: pip install pythonnet

      - name: Install macOS pywebview backend (pyobjc)
        if: runner.os == 'macOS'
        run: pip install pyobjc

      - name: Install Linux pywebview backend (GTK, with PyQt5 fallback)
        if: runner.os == 'Linux'
        run: |
          if sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.0; then
            echo "Installed GTK/WebKit2 backend."
          else
            echo "GTK/WebKit2 backend unavailable via apt; falling back to PyQt5/QtWebEngine."
            pip install PyQt5 PyQtWebEngine
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller vesdio.spec

      - name: Zip the distributable
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            Windows) ZIP_NAME="vesdio-windows.zip" ;;
            macOS)   ZIP_NAME="vesdio-macos.zip" ;;
            Linux)   ZIP_NAME="vesdio-linux.zip" ;;
          esac
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          # Use PowerShell's Compress-Archive on Windows for reliable
          # permission/attribute handling; zip elsewhere.
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -Command "Compress-Archive -Path vesdio_dist -DestinationPath $ZIP_NAME"
          else
            zip -r "$ZIP_NAME" vesdio_dist
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
